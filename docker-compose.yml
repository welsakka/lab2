version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_STRIPE_PRICE_ESSENTIAL=${STRIPE_PRICE_ESSENTIAL}
      - NEXT_PUBLIC_STRIPE_PRICE_PREMIUM=${STRIPE_PRICE_PREMIUM}
      - NEXT_PUBLIC_STRIPE_PRICE_FAMILY=${STRIPE_PRICE_FAMILY}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://halal:halal@db:5432/halal_finance
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - FRONTEND_URL=http://localhost:3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ESSENTIAL=${STRIPE_PRICE_ESSENTIAL}
      - STRIPE_PRICE_PREMIUM=${STRIPE_PRICE_PREMIUM}
      - STRIPE_PRICE_FAMILY=${STRIPE_PRICE_FAMILY}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=halal
      - POSTGRES_PASSWORD=halal
      - POSTGRES_DB=halal_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
